name: EveryDesk release

# Signed Windows release of apps/everydesk, started by pushing a tag `v*` (docs/release.md).
#
#   build    (no Environment, no secrets, contents: read)
#     checks the tag and tauri.conf.json, then runs the whole compile (npm, vcpkg, cargo and
#     every dependency build script) with the final app config and uploads the unsigned
#     target/release/EveryDesk.exe. Nothing that runs here can see a secret.
#   sign     (Environment `release`: waits for Rafael's approval; a FRESH runner)
#     checks the secrets, checks out the repo (config, icons, NSIS hooks, scripts; no npm, no
#     cargo build, no caches), installs only pinned tools (tauri-cli via `cargo install
#     --locked`, SSL.com CodeSignTool checked against CODESIGNTOOL_SHA256) and then:
#       `cargo-tauri bundle` (no compile) builds the NSIS setup, Authenticode-signing it through
#       bundle.windows.signCommand -> windows/sign.ps1 (eSigner, RFC 3161 timestamp), and
#       writes the updater .sig;
#       Authenticode on the portable, `signtool verify /pa /v` on every PE, then
#       `tauri signer sign --app-version` on the portable (after Authenticode, so the .sig
#       covers the final bytes) and latest.json (both targets, signatures checked against
#       the updater public key). Secrets are given only to the steps that use them.
#   publish  (no secrets, the only job with contents: write)
#     SHA256SUMS + `gh release create` (pre-release for tags like v0.1.0-rc1).
#
# signCommand and createUpdaterArtifacts exist only in the sign job's `--config`, never in
# tauri.conf.json, so everydesk-windows.yml and local builds stay unsigned and secret-free.
# No packers or obfuscation (antivirus false positives).

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: everydesk-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # tauri-cli that writes `version:` into the updater signature (--app-version).
  TAURI_CLI_VERSION: "2.12.3"
  # SSL.com CodeSignTool, pinned by version AND by SHA-256. SSL.com publishes no checksum, so
  # Rafael computes it once (docs/release.md, step 1.4) and pastes it here. Until then the
  # sign job stops before downloading anything.
  CODESIGNTOOL_VERSION: "v1.3.2"
  CODESIGNTOOL_SHA256: "" # SHA-256 of CodeSignTool-v1.3.2-windows.zip (64 hex characters)

jobs:
  build:
    name: compile (Windows x64, no secrets)
    runs-on: windows-2022
    permissions:
      contents: read
    timeout-minutes: 180
    env:
      LLVM_VERSION: "15.0.6"
      # Must match "builtin-baseline" in vcpkg.json.
      VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
      # Read-only: a release reuses the binary cache but never writes to it.
      VCPKG_BINARY_SOURCES: "clear;x-gha,read"
      VCPKG_DEFAULT_TRIPLET: "x64-windows-static"
      RUST_TARGET: "x86_64-pc-windows-msvc"
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check tag and config
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v((0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$') {
            Write-Host "::error::A tag '$env:TAG' não é uma versão válida (ex.: v0.1.0 ou v0.1.0-rc1)."
            exit 1
          }
          $version = $env:TAG.Substring(1)
          $core = $Matches[1]
          # Any suffix (-rc1, -beta.2) makes a GitHub pre-release.
          $prerelease = [bool]$Matches[5]
          $errors = @()

          $conf = Get-Content apps/everydesk/tauri.conf.json -Raw | ConvertFrom-Json
          if ($conf.version -ne $core) {
            $errors += "A tag $env:TAG não bate com version '$($conf.version)' em apps/everydesk/tauri.conf.json. Atualize o arquivo (ou a tag) antes do release."
          }
          if ($conf.plugins.updater.pubkey -eq 'COLE_AQUI_A_CHAVE_PUBLICA_DO_UPDATER') {
            if ($prerelease) {
              Write-Host "::warning::A chave pública do updater ainda é o marcador: esta versão nunca vai se atualizar sozinha."
            } else {
              $errors += "plugins.updater.pubkey em tauri.conf.json ainda é o marcador. Cole a chave pública (docs/release.md, 'Chave do updater')."
            }
          }
          if ($errors) {
            foreach ($e in $errors) { Write-Host "::error::$e" }
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($prerelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Release $version (pre-release: $prerelease)"
          exit 0

      - name: Test the latest.json generator
        run: python -I apps/everydesk/windows/test_make_latest_json.py

      # ---- toolchain: same setup as everydesk-windows.yml --------------------------------
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6.4.1
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install NASM
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Set LIBCLANG_PATH
        shell: bash
        run: echo "LIBCLANG_PATH=${LLVM_PATH}\\bin" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-18
        with:
          toolchain: stable
          targets: ${{ env.RUST_TARGET }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: everydesk-windows-2022
          workspaces: ". -> target"
          save-if: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/everydesk/ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir apps/everydesk/ui install --frozen-lockfile

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ env.VCPKG_DEFAULT_TRIPLET }}
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ env.VCPKG_DEFAULT_TRIPLET }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "${{ env.TAURI_CLI_VERSION }}" --locked

      - name: Compile EveryDesk.exe (final config, not bundled)
        working-directory: apps/everydesk
        env:
          VERSION: ${{ steps.check.outputs.version }}
        # The app embeds its config at compile time, so `version` is set here. signCommand and
        # createUpdaterArtifacts only matter to the bundler (sign job) and are not embedded.
        run: |
          @{ version = $env:VERSION } | ConvertTo-Json | Set-Content (Join-Path $env:RUNNER_TEMP 'compile.json') -Encoding utf8
          cargo tauri build --no-bundle --features hwcodec --config "$env:RUNNER_TEMP/compile.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the unsigned exe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: everydesk-unsigned
          path: target/release/EveryDesk.exe
          if-no-files-found: error
          retention-days: 3

  sign:
    name: bundle and sign (Environment release)
    needs: build
    runs-on: windows-2022
    environment: release
    permissions:
      contents: read
    timeout-minutes: 90
    outputs:
      esigner_env: ${{ steps.preflight.outputs.esigner_env }}
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - name: Check secrets and signing settings
        id: preflight
        env:
          ESIGNER_ENV: ${{ vars.ESIGNER_ENV }}
          HAS_ES_USERNAME: ${{ secrets.ES_USERNAME != '' }}
          HAS_ES_PASSWORD: ${{ secrets.ES_PASSWORD != '' }}
          HAS_ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID != '' }}
          HAS_ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET != '' }}
          HAS_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
        run: |
          $errors = @()
          foreach ($name in 'ES_USERNAME','ES_PASSWORD','ES_CREDENTIAL_ID','ES_TOTP_SECRET','TAURI_SIGNING_PRIVATE_KEY','TAURI_SIGNING_PRIVATE_KEY_PASSWORD') {
            if ([Environment]::GetEnvironmentVariable("HAS_$name") -ne 'true') {
              $errors += "Falta o segredo $name no Environment 'release' (docs/release.md)."
            }
          }
          if ($env:CODESIGNTOOL_SHA256 -notmatch '^[0-9A-Fa-f]{64}$') {
            $errors += "CODESIGNTOOL_SHA256 está vazio em .github/workflows/everydesk-release.yml. Calcule o SHA-256 do CodeSignTool $env:CODESIGNTOOL_VERSION e cole no arquivo (docs/release.md, passo 1.4)."
          }
          $esignerEnv = if ($env:ESIGNER_ENV -eq 'TEST') { 'TEST' } else { 'PROD' }
          if ($esignerEnv -eq 'TEST' -and $env:PRERELEASE -ne 'true') {
            $errors += "ESIGNER_ENV=TEST (sandbox) só é permitido em tags de teste como v0.1.0-rc1: um release normal com assinatura de teste chegaria aos usuários pelo updater."
          }
          if ($errors) {
            foreach ($e in $errors) { Write-Host "::error::$e" }
            exit 1
          }
          "esigner_env=$esignerEnv" >> $env:GITHUB_OUTPUT
          Write-Host "Assinando $env:VERSION (eSigner: $esignerEnv)"
          exit 0

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # hbb_common is a workspace member: `cargo metadata --no-deps` (used by the bundler)
          # needs its Cargo.toml. Nothing from the checkout is compiled or run except
          # windows/sign.ps1 and windows/make_latest_json.py.
          submodules: recursive
          persist-credentials: false

      - name: Download the unsigned exe
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: everydesk-unsigned
          path: target/release

      - name: Install Tauri CLI (pinned, locked)
        # Built from crates.io with its own Cargo.lock into a private folder and called by full
        # path. The runner's preinstalled Rust is used; no secrets are present in this step.
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'tauri-cli'
          cargo install tauri-cli --version "$env:TAURI_CLI_VERSION" --locked --root $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "TAURI=$(Join-Path $root 'bin\cargo-tauri.exe')" >> $env:GITHUB_ENV
          exit 0

      - name: Install SSL.com CodeSignTool (pinned, checksum verified)
        env:
          ESIGNER_ENV: ${{ steps.preflight.outputs.esigner_env }}
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "CodeSignTool-$env:CODESIGNTOOL_VERSION-windows.zip"
          $url = "https://github.com/SSLcom/CodeSignTool/releases/download/$env:CODESIGNTOOL_VERSION/CodeSignTool-$env:CODESIGNTOOL_VERSION-windows.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
          if ($hash -ne $env:CODESIGNTOOL_SHA256.ToUpper()) {
            Write-Host "::error::CodeSignTool $env:CODESIGNTOOL_VERSION tem SHA-256 $hash, diferente de CODESIGNTOOL_SHA256. Nada foi assinado."
            exit 1
          }
          $dir = Join-Path $env:RUNNER_TEMP 'codesigntool'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          $jar = Get-ChildItem -LiteralPath $dir -Recurse -Filter 'code_sign_tool-*.jar' | Select-Object -First 1
          if (-not $jar) { Write-Host '::error::code_sign_tool-*.jar não encontrado no zip.'; exit 1 }
          $home_ = $jar.Directory.Parent.FullName
          # CodeSignTool has no environment flag: SSL.com's own GitHub action implements its
          # `environment_name` input by writing this file. TEST = eSigner sandbox, else production.
          if ($env:ESIGNER_ENV -eq 'TEST') {
            $props = @(
              'CLIENT_ID=qOUeZCCzSqgA93acB3LYq6lBNjgZdiOxQc-KayC3UMw'
              'OAUTH2_ENDPOINT=https://oauth-sandbox.ssl.com/oauth2/token'
              'CSC_API_ENDPOINT=https://cs-try.ssl.com'
              'TSA_URL=http://ts.ssl.com'
              'TSA_LEGACY_URL=http://ts.ssl.com/legacy'
            )
          } else {
            $props = @(
              'CLIENT_ID=kaXTRACNijSWsFdRKg_KAfD3fqrBlzMbWs6TwWHwAn8'
              'OAUTH2_ENDPOINT=https://login.ssl.com/oauth2/token'
              'CSC_API_ENDPOINT=https://cs.ssl.com'
              'TSA_URL=http://ts.ssl.com'
              'TSA_LEGACY_URL=http://ts.ssl.com/legacy'
            )
          }
          New-Item -ItemType Directory -Force -Path (Join-Path $home_ 'conf') | Out-Null
          Set-Content -LiteralPath (Join-Path $home_ 'conf/code_sign_tool.properties') -Value $props -Encoding ascii
          "CODESIGNTOOL_DIR=$home_" >> $env:GITHUB_ENV
          Write-Host "CodeSignTool $env:CODESIGNTOOL_VERSION em $home_ (eSigner $env:ESIGNER_ENV)"
          exit 0

      - name: Locate signtool
        run: |
          $st = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
            Where-Object { $_.Directory.Name -eq 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $st) { Write-Host '::error::signtool.exe não encontrado'; exit 1 }
          "SIGNTOOL=$($st.FullName)" >> $env:GITHUB_ENV
          Write-Host $st.FullName
          exit 0

      - name: Write the bundle config
        run: |
          $sign = (Resolve-Path apps/everydesk/windows/sign.ps1).Path
          $release = @{
            version = $env:VERSION
            bundle = @{
              createUpdaterArtifacts = $true
              windows = @{
                signCommand = @{
                  cmd = 'pwsh'
                  args = @('-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', $sign, '%1')
                }
              }
            }
          }
          $release | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $env:RUNNER_TEMP 'release.json') -Encoding utf8
          Get-Content (Join-Path $env:RUNNER_TEMP 'release.json')
          exit 0

      - name: Bundle and sign the NSIS setup (no compile)
        working-directory: apps/everydesk
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # `bundle` only packages target/release/EveryDesk.exe (it never runs cargo build or the
        # frontend build). It runs makensis (downloaded and hash-checked by tauri-bundler),
        # sign.ps1 for each PE, then writes the setup's updater .sig.
        run: |
          $env:EVERYDESK_SIGN_LOG = Join-Path $env:RUNNER_TEMP 'sign.log'
          & $env:TAURI bundle --bundles nsis --features hwcodec --config "$env:RUNNER_TEMP/release.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          exit 0

      - name: Collect the release files
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $setup = "target/release/bundle/nsis/EveryDesk_$($env:VERSION)_x64-setup.exe"
          foreach ($f in $setup, "$setup.sig", 'target/release/EveryDesk.exe') {
            if (-not (Test-Path -LiteralPath $f)) { Write-Host "::error::Faltou $f"; Get-ChildItem target/release/bundle/nsis; exit 1 }
          }
          # tauri-bundler restores target/release/EveryDesk.exe unsigned and unpatched after
          # bundling: it becomes the portable and is signed below.
          Copy-Item $setup, "$setup.sig", target/release/EveryDesk.exe dist/
          Copy-Item LICENCE dist/LICENCE
          Get-ChildItem dist
          exit 0

      - name: Authenticode-sign the portable exe
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          $env:EVERYDESK_SIGN_LOG = Join-Path $env:RUNNER_TEMP 'sign.log'
          pwsh -NoProfile -NonInteractive -File apps/everydesk/windows/sign.ps1 dist/EveryDesk.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          exit 0

      - name: Verify Authenticode on every PE
        env:
          ESIGNER_ENV: ${{ steps.preflight.outputs.esigner_env }}
        run: |
          $failed = $false
          $setupName = "EveryDesk_$($env:VERSION)_x64-setup.exe"
          # DLLs that Tauri signs (NSIS_PLUGIN_FILES in tauri-bundler 2.10).
          $tauriSigned = 'NSISdl.dll', 'StartMenu.dll', 'System.dll', 'nsDialogs.dll', 'nsis_tauri_utils.dll'

          # 1. sign.log: every sign.ps1 call succeeded and each expected file was signed.
          #    makensis ignores the exit code of the uninstaller signing command, and passes
          #    the uninstaller as %TEMP%\nstXXXX.tmp (GetTempFileName prefix "nst").
          $log = @(Get-Content (Join-Path $env:RUNNER_TEMP 'sign.log'))
          $log | ForEach-Object { Write-Host "sign.log: $_" }
          if ($log -match '^FAIL ') { Write-Host '::error::sign.ps1 falhou em algum arquivo (sign.log).'; $failed = $true }
          $ok = @($log | Where-Object { $_ -like 'OK *' } | ForEach-Object { $_.Substring(3) })
          $expected = [ordered]@{
            'EveryDesk.exe do instalador' = '\\target\\release\\EveryDesk\.exe$'
            'desinstalador'              = '\\nst[0-9A-Fa-f]{1,4}\.tmp$'
            'setup'                      = '\\target\\release\\bundle\\nsis\\' + [regex]::Escape($setupName) + '$'
            'portátil'                   = '\\dist\\EveryDesk\.exe$'
          }
          foreach ($dll in $tauriSigned) { $expected["plugin $dll"] = '\\' + [regex]::Escape($dll) + '$' }
          foreach ($k in $expected.Keys) {
            if (-not ($ok | Where-Object { $_ -match $expected[$k] })) {
              Write-Host "::error::sign.log não mostra o $k assinado."; $failed = $true
            }
          }

          # 2. The released files and every PE inside the setup.
          $pes = @(Get-Item "dist/$setupName", dist/EveryDesk.exe)
          $inner = Join-Path $env:RUNNER_TEMP 'setup-contents'
          $sevenZip = Get-Command 7z -ErrorAction SilentlyContinue
          if (-not $sevenZip) { $sevenZip = Get-Command 'C:\Program Files\7-Zip\7z.exe' -ErrorAction SilentlyContinue }
          $extracted = $false
          if ($sevenZip) { & $sevenZip.Source x -y "-o$inner" "dist/$setupName" | Out-Null; $extracted = $LASTEXITCODE -eq 0 }
          if ($extracted) {
            $pes += Get-ChildItem $inner -Recurse -File | Where-Object { $_.Extension -in '.exe', '.dll' }
          } else {
            Write-Host '::warning::7-Zip não abriu o setup; os arquivos internos foram conferidos só pelo sign.log.'
          }
          foreach ($pe in $pes) {
            # Other NSIS plugins (nsExec.dll, used by windows/hooks.nsh) come unsigned from the
            # NSIS distribution and Tauri gives no hook to sign them: reported, not fatal.
            if ($pe.Extension -eq '.dll' -and $pe.Name -notin $tauriSigned) {
              $s = Get-AuthenticodeSignature -LiteralPath $pe.FullName
              if (-not $s.SignerCertificate) { Write-Host "::warning::$($pe.Name) (plugin NSIS) sem assinatura." }
              continue
            }
            Write-Host "=== $($pe.FullName)"
            $out = & $env:SIGNTOOL verify /pa /v $pe.FullName 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Host $out
            $sig = Get-AuthenticodeSignature -LiteralPath $pe.FullName
            if (-not $sig.SignerCertificate -or -not $sig.TimeStamperCertificate) {
              Write-Host "::error::$($pe.Name) sem assinatura ou sem carimbo de tempo."; $failed = $true
            } elseif ($env:ESIGNER_ENV -eq 'TEST') {
              # The sandbox certificate does not chain to a root Windows trusts, so signtool
              # exits 1 here by design; signature + timestamp were checked above.
              if ($code -ne 0) { Write-Host "::warning::$($pe.Name): assinatura de TESTE (sandbox), raiz não confiável, como esperado." }
            } elseif ($code -ne 0 -or $out -notmatch 'The signature is timestamped') {
              Write-Host "::error::signtool verify /pa falhou em $($pe.Name)."; $failed = $true
            }
          }
          if ($failed) { exit 1 }
          exit 0

      - name: Updater-sign the portable exe (after Authenticode)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          & $env:TAURI signer sign --app-version $env:VERSION dist/EveryDesk.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          exit 0

      - name: Write latest.json
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          $require = if ($env:PRERELEASE -eq 'true') { @() } else { @('--require-pubkey') }
          python -I apps/everydesk/windows/make_latest_json.py `
            --version $env:VERSION `
            --base-url "https://github.com/$env:REPO/releases/download/$env:TAG" `
            --setup "dist/EveryDesk_$($env:VERSION)_x64-setup.exe" `
            --portable dist/EveryDesk.exe `
            --pubkey-from-conf apps/everydesk/tauri.conf.json @require `
            --notes "EveryDesk $env:VERSION" `
            --out dist/latest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content dist/latest.json
          exit 0

      - name: Upload the release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: everydesk-release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish GitHub release
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: everydesk-release
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          ESIGNER_ENV: ${{ needs.sign.outputs.esigner_env }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          setup="EveryDesk_${VERSION}_x64-setup.exe"
          files=("$setup" "$setup.sig" EveryDesk.exe EveryDesk.exe.sig latest.json LICENCE)
          for f in "${files[@]}"; do test -s "$f" || { echo "::error::faltou $f"; exit 1; }; done
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

          {
            if [ "$ESIGNER_ENV" = "TEST" ]; then
              echo "> **Versão de TESTE assinada no sandbox do eSigner. Não instale fora de testes e nunca marque como latest.**"
              echo
            fi
            echo "EveryDesk ${VERSION} para Windows 10/11 (64 bits)."
            echo
            echo "- \`${setup}\`: instalador (acesso permanente, inicia com o Windows)."
            echo "- \`EveryDesk.exe\`: versão portátil, roda sem instalar."
            echo
            echo "Confira o arquivo baixado com \`SHA256SUMS\` (PowerShell: \`Get-FileHash EveryDesk.exe\`)."
            echo "Código-fonte (AGPL-3.0): https://github.com/${REPO}/tree/${TAG}"
          } > notes.md

          flags=(--verify-tag --title "EveryDesk ${VERSION}" --notes-file notes.md)
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease --latest=false)
          else
            flags+=(--latest)
          fi
          gh release create "$TAG" --repo "$REPO" "${flags[@]}" "${files[@]}" SHA256SUMS
